<script>

const monthNames = [

];

const axisMonths = [

const hourNames = [

function buildArchiveList() {

  const files = [];

  const currentYear =
    new Date().getFullYear();

  for (let year = 2025; year <= currentYear; year++) {

    for (let month = 1; month <= 12; month++) {

      const mm =
        String(month).padStart(2, "0");

      files.push(
        `../archives/${year}/${mm}.json`
      );

    }

  }

  return files;

}

let allRecords = [];

async function loadAllRecords() {

  const allRecords = [];

  const files =
    buildArchiveList();

  for (const file of files) {

    try {

      const response =
        await fetch(file);

      if (!response.ok) {
        continue;
      }

const data =
  await response.json();

data.forEach(record => {

  record.theta_e =
    calculateThetaE(record);

});

allRecords.push(...data);

    } catch {

      continue;

    }

  }

  return allRecords;

}

function populateYears(records) {

  const years =
    [...new Set(
      records.map(record =>
        new Date(record.time * 1000).getFullYear()
      )
    )].sort();

  console.log(years);

  const yearSelect =
    document.getElementById("year");

  for (const year of years) {

    const option =
      document.createElement("option");

    option.value = year;
    option.textContent = year;

    yearSelect.appendChild(option);

  }

}

function FtoC(value) {

  return (value - 32) * 5 / 9;

}

function calculateThetaE(record) {

  const tempC =
    FtoC(record.temp_avg);

  const dewpointC =
    FtoC(record.dew_point_last);

  const tempK =
    tempC + 273.15;

  const dewpointK =
    dewpointC + 273.15;

  const e =
    6.112 *
    Math.exp(
      (
        17.67 * dewpointC
      ) /
      (
        dewpointC + 243.5
      )
    );

  const q =
    (
      0.622 * e
    ) /
    (
      1013.25 - 0.378 * e
    );

  return (
    tempK *
    Math.exp(
      (
        (3376 / dewpointK)
        - 2.54
      ) *
      q *
      (
        1 + 0.81 * q
      )
    )
  );

}

function getReportingDay(date, variable, statistic) {

  const d = new Date(date);

  const hour = d.getHours();
  const minute = d.getMinutes();

  if (variable === "Temperature") {

    if (
      statistic === "Maximum" &&
      (
        hour < 9 ||
        (hour === 9 && minute < 5)
      )
    ) {
      d.setDate(d.getDate() - 1);
    }

    if (
      statistic === "Minimum" &&
      (
        hour > 18 ||
        (hour === 18 && minute >= 5)
      )
    ) {
      d.setDate(d.getDate() + 1);
    }

  }

  if (variable === "Humidity") {

    if (
      statistic === "Maximum" &&
      (
        hour > 18 ||
        (hour === 18 && minute >= 5)
      )
    ) {
      d.setDate(d.getDate() + 1);
    }

    if (
      statistic === "Minimum" &&
      (
        hour < 9 ||
        (hour === 9 && minute < 5)
      )
    ) {
      d.setDate(d.getDate() - 1);
    }

  }

  return d.toISOString().slice(0,10);

}

function percentile(values, p) {

  if (!values.length) {
    return null;
  }

  const sorted =
    [...values].sort(
      (a,b) => a - b
    );

  const index =
    Math.floor(
      (sorted.length - 1) * p
    );

  return sorted[index];

}

function clearSkySolar(
  timestamp,
  elevationM = 130
) {

  const lat =
    -38.16330;

  const date =
    new Date(timestamp * 1000);

  const start =
    new Date(
      date.getFullYear(),
      0,
      0
    );

  const day =
    Math.floor(
      (date - start) /
      86400000
    );

const gamma =
  (2 * Math.PI / 365) *
  (day - 1);

const earthSunFactor =
  1.00011 +
  0.034221 * Math.cos(gamma) +
  0.00128 * Math.sin(gamma) +
  0.000719 * Math.cos(2 * gamma) +
  0.000077 * Math.sin(2 * gamma);

const decl =
  0.006918 -
  0.399912 * Math.cos(gamma) +
  0.070257 * Math.sin(gamma) -
  0.006758 * Math.cos(2 * gamma) +
  0.000907 * Math.sin(2 * gamma) -
  0.002697 * Math.cos(3 * gamma) +
  0.00148 * Math.sin(3 * gamma);

   const eqTime =
    229.18 * (
      0.000075 +
      0.001868 * Math.cos(gamma) -
      0.032077 * Math.sin(gamma) -
      0.014615 * Math.cos(2 * gamma) -
      0.040849 * Math.sin(2 * gamma)
    );
  
  const timezoneOffset =
    -date.getTimezoneOffset() / 60;
  
  const minutes =
    date.getHours() * 60 +
    date.getMinutes() +
    date.getSeconds() / 60;
  
  const solarTime =
    minutes +
    eqTime +
    4 * (144.30763 - 15 * timezoneOffset);
  
  const hourAngle =
    (solarTime / 4 - 180) *
    Math.PI / 180;

  const latRad =
    lat *
    Math.PI / 180;

  const solarElevation =
    Math.asin(

      Math.sin(latRad) *
      Math.sin(decl)

      +

      Math.cos(latRad) *
      Math.cos(decl) *
      Math.cos(hourAngle)

    );

  if (
    solarElevation <= 0
  ) {
    return 0;
  }

  const solarElevationDeg =
    solarElevation *
    180 /
    Math.PI;

  const airMass =
    1 /
    (
      Math.sin(solarElevation)
      +
      0.50572 *
      Math.pow(
        solarElevationDeg +
        6.07995,
        -1.6364
      )
    );

  const pressureFactor =
    Math.exp(
      -elevationM /
      8434.5
    );

  const adjustedAirMass =
    airMass *
    pressureFactor;

const irradiance =
  1361 *
  earthSunFactor *
  Math.sin(
    solarElevation
  ) *
  Math.pow(
    0.88,
    adjustedAirMass
  );

const seasonalFactor =
  0.995 +
  0.08 *
  Math.cos(
    2 * Math.PI *
    (day - 196) / 365
  );

return Math.max(
  0,
  irradiance * seasonalFactor
);

}

function matchesSeason(month, season) {

  if (season === "Summer") {
    return [11, 0, 1].includes(month);
  }

  if (season === "Autumn") {
    return [2, 3, 4].includes(month);
  }

  if (season === "Winter") {
    return [5, 6, 7].includes(month);
  }

  if (season === "Spring") {
    return [8, 9, 10].includes(month);
  }

  return false;

}

function updatePlotTypeAvailability() {

  const statistic =
    document.getElementById("statistic");

  const gustFactorOption =
  statistic.options[3];

  const frequencyOption =
  statistic.options[4];

  const plotType =
    document.getElementById("plotType");

  const month =
    document.getElementById("month");

  const selectedMonth =
    month.value;

  const variable =
  document.getElementById("variable")
    .value;

  if (
  variable === "Rainfall" &&
  statistic.value === "Frequency"
) {

  plotType.value =
    "Hourly Climatology";

}

  const seasonOption =
  month.options[14]; // "Season"

  const summerOption =
  month.options[15];

const autumnOption =
  month.options[16];

const winterOption =
  month.options[17];

const springOption =
  month.options[18];

if (
  variable === "Rainfall" &&
  statistic.value === "Frequency"
) {

  seasonOption.disabled = true;

  if (month.value === "Season") {
    month.value = "All Months";
  }

}

if (
  variable === "Wind" &&
  statistic.value === "Gust Factor" &&
  plotType.value === "Heatmap Climatology"
) {

  seasonOption.disabled = true;

  summerOption.disabled = false;
  autumnOption.disabled = false;
  winterOption.disabled = false;
  springOption.disabled = false;

  for (let i = 1; i <= 12; i++) {
    month.options[i].disabled = false;
  }

  if (month.value === "Season") {
    month.value = "All Months";
  }

} else {

  seasonOption.disabled = false;

}

if (
  plotType.value === "Monthly Climatology"
) {

  seasonOption.disabled = false;

  summerOption.disabled = true;
  autumnOption.disabled = true;
  winterOption.disabled = true;
  springOption.disabled = true;

  if (
    [
      "Summer",
      "Autumn",
      "Winter",
      "Spring"
    ].includes(month.value)
  ) {
    month.value = "Season";
  }

} 
else {

  if (
    plotType.value !== "Histogram"
  ) {
    seasonOption.disabled = false;
  }

  summerOption.disabled = false;
  autumnOption.disabled = false;
  winterOption.disabled = false;
  springOption.disabled = false;

}
if (plotType.value === "Heatmap Climatology") {

  if (variable !== "Wind") {

    statistic.value = "Mean";

    for (let i = 1; i < statistic.options.length; i++) {
      statistic.options[i].disabled = true;
    }

  }

  return;

}

if (variable === "Wind") {

  gustFactorOption.hidden = false;

} else {

  gustFactorOption.hidden = true;

  if (
    statistic.value === "Gust Factor"
  ) {
    statistic.value = "Mean";
  }

}

if (variable === "Rainfall") {

  frequencyOption.hidden = false;

} else {

  frequencyOption.hidden = true;

  if (
    statistic.value === "Frequency"
  ) {
    statistic.value = "Mean";
  }

}

const hourlyOption =
  plotType.options[1];

const heatmapOption =
  plotType.options[2];

const histogramOption =
  plotType.options[3];

  if (
  variable === "Rainfall" &&
  statistic.value === "Frequency"
) {

  hourlyOption.disabled = false;

  heatmapOption.disabled = true;
  histogramOption.disabled = true;

} else {

  heatmapOption.disabled = false;
  histogramOption.disabled = false;

}

  if (selectedMonth === "Season") {

    plotType.value =
      "Monthly Climatology";

    hourlyOption.disabled = true;

    return;

  }

  for (let i = 1; i < statistic.options.length; i++) {
  statistic.options[i].disabled = false;
}

if (

  statistic.value === "Mean"

  ||

  (
    variable === "Wind" &&
    statistic.value === "Gust Factor"
  )

  ||

  (
    variable === "Rainfall" &&
    statistic.value === "Frequency"
  )

  ||

  plotType.value ===
    "Heatmap Climatology"

)
{

    hourlyOption.disabled = false;

    for (let i = 1; i <= 12; i++) {
      month.options[i].disabled = false;
    }

  } else {

    hourlyOption.disabled = true;

    plotType.value =
      "Monthly Climatology";

    for (let i = 1; i <= 12; i++) {
      month.options[i].disabled = true;
    }

    if (
      month.selectedIndex >= 1 &&
      month.selectedIndex <= 12
    ) {
      month.value = "All Months";
    }

  }

  if (
  plotType.value === "Histogram"
) {

  seasonOption.disabled = true;

  if (month.value === "Season") {
    month.value = "All Months";
  }

}

if (
  variable === "Rainfall" &&
  statistic.value === "Frequency"
) {

  seasonOption.disabled = true;

}

const rainThresholdContainer =
  document.getElementById(
    "rainThresholdContainer"
  );

if (
  variable === "Rainfall" &&
  statistic.value === "Frequency" &&
  plotType.value === "Hourly Climatology"
) {

  rainThresholdContainer.style.display =
    "block";

}
else {

  rainThresholdContainer.style.display =
    "none";

}

}

function generateHeatmap(
  records,
  variable,
  selectedYear
) {

  let field;

  if (variable === "Temperature") {
    field = "temp_avg";
  }

  if (
    variable ===
    "Equivalent Potential Temperature"
  ) {
    field = "theta_e";
  }

  if (variable === "Humidity") {
    field = "hum_last";
  }

  if (variable === "Dew Point") {
    field = "dew_point_last";
  }

  if (variable === "Wind") {

  field = "wind_speed_avg";

}

  const z = [];

  for (let hour = 0; hour < 24; hour++) {

    const row = [];

    for (let month = 0; month < 12; month++) {

      const values =
        records
          .filter(record => {

            const date =
              new Date(
                record.time * 1000
              );

            return (
              date.getHours() === hour &&
              date.getMonth() === month &&
              (
                selectedYear === "All Years" ||
                String(
                  date.getFullYear()
                ) === selectedYear
              )
            );

          })
          .map(record => {

            let value =
              record[field];

if (
  variable === "Temperature" ||
  variable === "Dew Point"
) {
  value = FtoC(value);
}

            return value;

          })
          .filter(value =>
            value !== null &&
            value !== undefined
          );

      if (values.length === 0) {

        row.push(null);

      } else {

        row.push(
          values.reduce(
            (a,b) => a + b,
            0
          ) / values.length
        );

      }

    }

    z.push(row);

  }

  let colorscale;

  if (variable === "Humidity") {

    colorscale = [
      [0.0, "#8b0000"],
      [0.1, "#ff0000"],
      [0.2, "#ff7f00"],
      [0.3, "#ffff00"],
      [0.4, "#adff2f"],
      [0.5, "#00ff00"],
      [0.6, "#00ffff"],
      [0.7, "#87ceeb"],
      [0.8, "#4169e1"],
      [0.9, "#0000ff"],
      [1.0, "#00008b"]
    ];

  }
  else if (variable === "Dew Point") {

    colorscale = "RdYlBu";

  }
  else {

    colorscale = "Turbo";

  }

  Plotly.newPlot(
    "output",
    [{
      z: z,
      x: axisMonths,
      y: hourNames,
      type: "heatmap",
      colorscale: colorscale,
colorbar: {
  title:
    variable === "Humidity"
      ? "%"
      : variable ===
          "Equivalent Potential Temperature"
        ? "K"
        : "°C"
}
    }],
    {
      title:
        `${variable} Heatmap Climatology`,

      paper_bgcolor: "#2d2d2d",
      plot_bgcolor: "#2d2d2d",

      font: {
        color: "white"
      },

      xaxis: {
        title: "Month"
      },

      yaxis: {
        title: "Hour"
      }
    }
  );

}

function generateHistogram(
  records,
  variable,
  statistic,
  selectedMonth,
  selectedYear
) {

let field;

if (variable === "Wind") {

  field = "wind_speed_avg";

}

if (
  variable ===
  "Solar Radiation"
) {

  field =
    "solar_rad_avg";

}

if (variable === "Temperature") {

  if (statistic === "Mean") {
    field = "temp_avg";
  }

  if (statistic === "Maximum") {
    field = "temp_hi";
  }

  if (statistic === "Minimum") {
    field = "temp_lo";
  }

}

  if (
  variable ===
  "Equivalent Potential Temperature"
) {

  field = "theta_e";

}

if (variable === "Humidity") {

  if (statistic === "Mean") {
    field = "hum_last";
  }

  if (statistic === "Maximum") {
    field = "hum_hi";
  }

  if (statistic === "Minimum") {
    field = "hum_lo";
  }

}

if (variable === "Dew Point") {

  if (statistic === "Mean") {
    field = "dew_point_last";
  }

  if (statistic === "Maximum") {
    field = "dew_point_hi";
  }

  if (statistic === "Minimum") {
    field = "dew_point_lo";
  }

}

const filteredRecords =
  records.filter(record => {

    const date =
      new Date(record.time * 1000);

    const year =
      date.getFullYear();

    const monthName =
      monthNames[date.getMonth()];

    return (

      (selectedYear === "All Years" ||
       String(year) === selectedYear)

      &&

      (

        selectedMonth === "All Months"

        ||

        monthName === selectedMonth

        ||

        (
          ["Summer","Autumn","Winter","Spring"]
            .includes(selectedMonth)

          &&

          matchesSeason(
            date.getMonth(),
            selectedMonth
          )
        )

      )

    );

  });

  let values;

  if (statistic === "Mean") {

  values =
    filteredRecords
      .map(record => {

        let value =
          record[field];

        if (
          variable === "Temperature" ||
          variable === "Dew Point"
        ) {
          value = FtoC(value);
        }

        return value;

      })
      .filter(value =>
        value !== null &&
        value !== undefined
      );

}
else {

  const dailyValues = {};

  filteredRecords.forEach(record => {

    const date =
      new Date(record.time * 1000);

    const key =
      getReportingDay(
        date,
        variable,
        statistic
      );

    let value =
      record[field];

    if (
      variable === "Temperature" ||
      variable === "Dew Point"
    ) {
      value = FtoC(value);
    }

    if (
      value === null ||
      value === undefined
    ) {
      return;
    }

    if (!(key in dailyValues)) {

      dailyValues[key] =
        value;

    } else {

      if (statistic === "Maximum") {

        dailyValues[key] =
          Math.max(
            dailyValues[key],
            value
          );

      } else {

        dailyValues[key] =
          Math.min(
            dailyValues[key],
            value
          );

      }

    }

  });

  values =
    Object.values(
      dailyValues
    );

}

Plotly.newPlot(
  "output",
  [{
    x: values,
    type: "histogram",
    nbinsx: 30
  }],
  {
    title:
      `${variable} · ${statistic} · ${selectedMonth}`,

    paper_bgcolor: "#2d2d2d",
    plot_bgcolor: "#2d2d2d",

    font: {
      color: "white"
    },

xaxis: {
  title:
    variable === "Humidity"
      ? "Relative Humidity (%)"
      : variable === "Wind"
        ? "Wind Speed (km/h)"
        : "Temperature (°C)"
},

    yaxis: {
      title: "Frequency"
    }
  }
);

}

function generateWindRoseHeatmap(
  records,
  selectedMonth,
  selectedYear
) {

  const filteredRecords =
  records.filter(record => {

    const date =
      new Date(record.time * 1000);

    const year =
      date.getFullYear();

    const monthName =
      monthNames[
        date.getMonth()
      ];

    return (

      (
        selectedYear === "All Years" ||
        String(year) === selectedYear
      )

      &&

      (

        selectedMonth === "All Months"

        ||

        monthName === selectedMonth

        ||

        (
          ["Summer","Autumn","Winter","Spring"]
            .includes(selectedMonth)

          &&

          matchesSeason(
            date.getMonth(),
            selectedMonth
          )
        )

      )

    );

  });

const frequencyMap = {};

filteredRecords.forEach(record => {

  const speed =
    record.wind_speed_avg;

  const direction =
    record.wind_dir_of_prevail;

  if (
    speed == null ||
    direction == null
  ) {
    return;
  }

const speedBin =
  Math.round(speed * 5) / 5;

const directionBin =
  Math.floor(direction / 5) * 5;

const key =
  `${speedBin}_${directionBin}`;

  frequencyMap[key] =
    (frequencyMap[key] || 0) + 1;

});

const smoothedMap = {};

Object.entries(
  frequencyMap
).forEach(([key, count]) => {

  const [speed, direction] =
    key.split("_").map(Number);

  for (let ds = -2; ds <= 2; ds++) {

    for (let dd = -3; dd <= 3; dd++) {

      const s =
        speed + ds * 0.5;

      let d =
        direction + dd * 5;

      while (d < 0) d += 360;
      while (d >= 360) d -= 360;

      const neighbourKey =
        `${s}_${d}`;

      const distance =
        Math.abs(ds) + Math.abs(dd);

      const weight =
        1 / (1 + distance);

      smoothedMap[neighbourKey] =
        (smoothedMap[neighbourKey] || 0)
        + count * weight;

    }

  }

});
const theta = [];
const radius = [];
const frequency = [];

Object.entries(
  smoothedMap
).forEach(([key, count]) => {

  const parts =
    key.split("_");

  radius.push(
    Number(parts[0])
  );

  theta.push(
    Number(parts[1])
  );

frequency.push(
  Math.sqrt(count)
);

      records.filter(record => {

        const date =
          new Date(record.time * 1000);

        const monthName =
          monthNames[
            date.getMonth()
          ];

          date.getFullYear();

        return (

          date.getHours() === hour

          &&

          (

            String(year) === selectedYear
          )

          &&

          (

            ||

            monthName === selectedMonth

            ||

            (
              [

                "Winter",
                "Spring"
              ].includes(selectedMonth)

              &&

              matchesSeason(
                date.getMonth(),
                selectedMonth
              )
            )

          )

        );

      });

const rainyDays =
  new Set();

const allDays =
  new Set();

matching.forEach(record => {

  const date =
    new Date(record.time * 1000);

  const dayKey =
    date.toISOString().slice(0,10);

  allDays.add(dayKey);

if (

  (threshold === 0 &&
   record.rainfall_mm > 0)

  ||

   record.rainfall_mm >= threshold)

) {

  rainyDays.add(dayKey);

}

const frequency =
  allDays.size === 0

        rainyDays.size /

function getSolarValue(
  record,
  date
) {

  const mainSolar =
    record.solar_rad_avg;

  const roofSolar =
    record.solar_rad_avg_552869;

  const month =
    date.getMonth();

  const minutes =
    date.getHours() * 60 +
    date.getMinutes();

  switch (month) {

    case 0: // Jan
      if (
        minutes <= 505 ||
        minutes >= 1080
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 1: // Feb
      if (
        minutes <= 510 ||
        minutes >= 1110
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 2: // Mar
      if (
        minutes <= 505 ||
        minutes >= 1105
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 3: // Apr
      if (
        minutes >= 1010
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 4: // May
      if (
        minutes <= 495
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 5: // Jun
      if (
        minutes <= 535
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 7: // Aug
      if (
        minutes >= 995
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 10: // Nov
      if (
        minutes <= 485 ||
        minutes >= 1060
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

    case 11: // Dec
      if (
        minutes <= 490 ||
        minutes >= 1070
      ) {
        return roofSolar ?? mainSolar;
      }
      break;

  }

  return mainSolar;

}

function generateSolarEnergyClimatology(
  records,
  selectedYear
) {

  const energyTraces = [];
  const transmissionTraces = [];

  for (let month = 0; month < 12; month++) {

    const dailyTotals = {};

    records.forEach(record => {

      const date =
        new Date(record.time * 1000);

      if (
        selectedYear !== "All Years" &&
        String(date.getFullYear()) !== selectedYear
      ) {
        return;
      }

      if (
        date.getMonth() !== month
      ) {
        return;
      }

      const solar =
        getSolarValue(
          record,
          date
        );

      if (solar == null) {
        return;
      }

      const dayKey =
        date.toISOString().slice(0,10);

      if (!dailyTotals[dayKey]) {

        dailyTotals[dayKey] = {

          energy: 0,
          potential: 0

        };

      }

      dailyTotals[dayKey].energy +=
        solar * 300 / 1000000;

      dailyTotals[dayKey].potential +=
        clearSkySolar(
          record.time
        ) * 300 / 1000000;

    });

    const monthlyEnergy = [];
    const monthlyTransmission = [];

    Object.values(
      dailyTotals
    ).forEach(day => {

      monthlyEnergy.push(
        day.energy
      );

      if (day.potential > 0) {

        monthlyTransmission.push(
          day.energy /
          day.potential *
          100
        );

      }

    });

    energyTraces.push({

      y: monthlyEnergy,

      type: "box",

      name:
        axisMonths[month]

    });

    transmissionTraces.push({

      y: monthlyTransmission,

      type: "box",

      name:
        axisMonths[month],

      visible: false

    });

  }

  Plotly.newPlot(
    "output",
    [

      ...energyTraces,

      ...transmissionTraces

    ],

    selectedMonth,
    selectedYear
  );

  return;

}

document.getElementById(
  "output"
).style.display = "block";

document.getElementById(
  "windContainer"
).style.display = "none";

document.getElementById(
  "gustContainer"
).style.display = "none";

if (plotType === "Heatmap Climatology") {

  if (
    variable === "Wind" &&
    statistic === "Gust Factor"
  ) {

document.getElementById(
  "output"
).style.display = "none";

document.getElementById(
  "gustContainer"
).style.display = "flex";

generateGustFactorRose(
  records,
  selectedMonth,
  selectedYear
);

generateGustFactorHeatmap(
  records,
  selectedMonth,
  selectedYear
);

return;
  }
else if (
  variable === "Wind"
) {

  document.getElementById(
    "output"
  ).style.display = "none";

  document.getElementById(
    "windContainer"
  ).style.display = "block";

  generateWindRoseHeatmap(
    records,
    selectedMonth,
    selectedYear
  );

}
  else {

    generateHeatmap(
      records,
      variable,
      selectedYear
    );

  }

  return;

}

if (plotType === "Histogram") {

  generateHistogram(
    records,
    variable,
    statistic,
    selectedMonth,
    selectedYear
  );

  return;

}

let field;

  if (variable === "Wind") {
  
    field = "wind_speed_avg";
  
  }
  
  if (variable === "Temperature") {

  if (statistic === "Mean") {
    field = "temp_avg";
  }

  if (statistic === "Maximum") {
    field = "temp_hi";
  }

  if (statistic === "Minimum") {
    field = "temp_lo";
  }

} 

  if (
  variable ===
  "Equivalent Potential Temperature"
) {

  field = "theta_e";

}

if (variable === "Humidity") {

  if (statistic === "Mean") {
    field = "hum_last";
  }

    if (statistic === "Maximum") {
    field = "hum_hi";
  }

  if (statistic === "Minimum") {
    field = "hum_lo";
  }

}

if (variable === "Dew Point") {

  if (statistic === "Mean") {
    field = "dew_point_last";
  }

    if (statistic === "Maximum") {
    field = "dew_point_hi";
  }

  if (statistic === "Minimum") {
    field = "dew_point_lo";
  }

}

  const traces = [];

const specificMonth =
  monthNames.includes(
    selectedMonth
  );

const groupCount =
  plotType === "Monthly Climatology"
    ? (
        specificMonth
          ? 31
          : 12
      )
    : 24;

for (let group = 0; group < groupCount; group++) {

  const seasonName =
    seasonNames[group];

const filteredRecords =
      records
.filter(record => {

  const date =
    new Date(record.time * 1000);

  const year =
    date.getFullYear();

if (plotType === "Monthly Climatology") {

  if (selectedMonth === "Season") {

    return (
      matchesSeason(
        date.getMonth(),
        seasonName
      ) &&
      (
        selectedYear === "All Years" ||
        String(year) === selectedYear
      )
    );

  }

  if (
    ["Summer","Autumn","Winter","Spring"]
      .includes(selectedMonth)
  ) {

    return (
      matchesSeason(
        date.getMonth(),
        selectedMonth
      ) &&
      (
        selectedYear === "All Years" ||
        String(year) === selectedYear
      )
    );

  }

if (specificMonth) {

  return (

    date.getMonth() ===
      monthNames.indexOf(
        selectedMonth
      )

    &&

    date.getDate() ===
      group + 1

    &&

    (
      selectedYear === "All Years" ||
      String(year) === selectedYear
    )

  );

}

return (

  date.getMonth() === group

  &&

  (
    selectedYear === "All Years" ||
    String(year) === selectedYear
  )

);

}

  const monthName =
    monthNames[date.getMonth()];

  return (
    date.getHours() === group &&
    (
      selectedYear === "All Years" ||
      String(year) === selectedYear
    ) &&
    (
      selectedMonth === "All Months" ||

      monthName === selectedMonth ||

      (
        ["Summer","Autumn","Winter","Spring"]
          .includes(selectedMonth) &&

        matchesSeason(
          date.getMonth(),
          selectedMonth
        )
      )
    )
  );

})

  let values;

if (
  variable === "Wind" &&
  statistic === "Gust Factor"
) {

  values =
    filteredRecords
      .map(record => {

        const meanSpeed =
          record.wind_speed_avg;

        const gustSpeed =
          record.wind_speed_hi;

        if (
          meanSpeed == null ||
          gustSpeed == null ||
          meanSpeed <= 0
        ) {
          return null;
        }

        return (
          gustSpeed /
          meanSpeed
        );

      })
      .filter(value =>
        value !== null
      );

}
else if (statistic === "Mean") {

  values =
    filteredRecords
      .map(record => {

        let value =
          record[field];

        if (
          variable === "Temperature" ||
          variable === "Dew Point"
        ) {
          value = FtoC(value);
        }

        return value;

      })
      .filter(value =>
        value !== null &&
        value !== undefined
      );

}
else {


  const dailyValues = {};

  filteredRecords.forEach(record => {

  const date =
    new Date(record.time * 1000);

  const key =
    getReportingDay(
      date,
      variable,
      statistic
    );

  let value =
    record[field];

  if (
    variable === "Temperature" ||
    variable === "Dew Point"
  ) {
    value = FtoC(value);
  }

  if (
    value === null ||
    value === undefined
  ) {
    return;
  }

  if (!(key in dailyValues)) {

    dailyValues[key] =
      value;

  } else {

    if (statistic === "Maximum") {

      dailyValues[key] =
        Math.max(
          dailyValues[key],
          value
        );

    } else {

      dailyValues[key] =
        Math.min(
          dailyValues[key],
          value
        );

    }

  }

});

    values =
    Object.values(
      dailyValues
    );

  }

traces.push({
  y: values,
  type: "box",
name:

  selectedMonth === "Season"

    ? seasonNames[group]

    : (

        plotType ===
          "Monthly Climatology"

          ? (

              specificMonth

                ? String(group + 1)

                : axisMonths[group]

            )

          : hourNames[group]

      )
});

}

Plotly.newPlot(
  "output",
  traces,
  {
    title:
      `${variable} · ${statistic} · ${selectedMonth} · ${plotType}`,

yaxis: {

  title:
    variable === "Humidity"
      ? "Relative Humidity (%)"
      : (
          variable === "Wind" &&
          statistic === "Gust Factor"
        )
          ? "Gust Factor"
          : variable === "Wind"
            ? "Wind Speed (km/h)"
            : "Temperature (°C)",

  ...(variable === "Wind" &&
     statistic === "Gust Factor"
       ? {
           range: [1, 3]
         }
       : {})

},

    paper_bgcolor: "#2d2d2d",
    plot_bgcolor: "#2d2d2d",

    font: {
      color: "white"
    }
  }
);

}

loadAllRecords().then(records => {

  allRecords = records;

  populateYears(records);
  console.log(records.length);

});

updatePlotTypeAvailability();

document
  .getElementById("statistic")
  .addEventListener(
    "change",
    updatePlotTypeAvailability
  );

document
  .getElementById("month")
  .addEventListener(
    "change",
    updatePlotTypeAvailability
  );

  document
  .getElementById("plotType")
  .addEventListener(
    "change",
    updatePlotTypeAvailability
  );

  document
  .getElementById("variable")
  .addEventListener(
    "change",
    updatePlotTypeAvailability
  );

document
  .getElementById("generateButton")
  .addEventListener("click", testLoad);

  document
  .getElementById("rainThreshold")
  .addEventListener(
    "change",
    testLoad
  );
  
</script>

</body>
</html>
