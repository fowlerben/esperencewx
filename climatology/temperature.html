<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Climate Explorer</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: white;
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #2d2d2d;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

select {
  padding: 6px;
}

button {
  padding: 8px 16px;
}

</style>

</head>

<body>

<div class="card">

<h1>Climate Explorer</h1>

<div class="control-row">

<div>
<label>Variable</label><br>
<select id="variable">
<option>Temperature</option>
<option>Dew Point</option>
<option>Humidity</option>
</select>
</div>

<div>
<label>Month</label><br>
<select id="month">
<option>All Months</option>
<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>
</select>
</div>

<div>
<label>Year</label><br>
<select id="year">
<option>All Years</option>
</select>
</div>

<div>
<label>Hour</label><br>
<select id="hour">
<option>All Hours</option>
</select>
</div>

</div>

<br>

<button id="generateButton">
Generate Box Plot
</button>

</div>

<div class="card">

<div id="output">
Ready.
</div>

</div>

<script>

// JavaScript goes here

</script>

</body>
</html>
