<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Climate Explorer</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: white;
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #2d2d2d;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

select {
  padding: 6px;
}

button {
  padding: 8px 16px;
}

</style>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

</head>

<body>

<div class="card">

<h1>Climate Explorer</h1>

<div class="control-row">

<div>
<label>Variable</label><br>
<select id="variable">
<option>Temperature</option>
<option>Dew Point</option>
<option>Humidity</option>
</select>
</div>

<div>
<label>Month</label><br>
<select id="month">
<option>All Months</option>
<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>
</select>
</div>

<div>
<label>Year</label><br>
<select id="year">
<option>All Years</option>
</select>
</div>

<div>
<label>Hour</label><br>
<select id="hour">
<option>All Hours</option>
</select>
</div>

</div>

<br>

<button id="generateButton">
Generate Box Plot
</button>

</div>

<div class="card">

<div id="output" style="height:700px;"></div>

</div>

<script>

const variableMap = {
  "Temperature": "temp_last",
  "Dew Point": "dew_point_last",
  "Humidity": "hum_last"
};

const monthNames = [
  "Jan","Feb","Mar","Apr","May","Jun",
  "Jul","Aug","Sep","Oct","Nov","Dec"
];

function buildArchiveList() {

  const files = [];

  const currentYear =
    new Date().getFullYear();

  for (let year = 2025; year <= currentYear; year++) {

    for (let month = 1; month <= 12; month++) {

      const mm =
        String(month).padStart(2, "0");

      files.push(
        `../archives/${year}/${mm}.json`
      );

    }

  }

  return files;

}

async function loadAllRecords() {

  const allRecords = [];

  const files =
    buildArchiveList();

  for (const file of files) {

    try {

      const response =
        await fetch(file);

      if (!response.ok) {
        continue;
      }

      const data =
        await response.json();

      allRecords.push(...data);

    } catch {

      continue;

    }

  }

  return allRecords;

}

async function testLoad() {

  Plotly.newPlot(
    "output",
    [{
      y: [1, 2, 3, 4, 5],
      type: "box"
    }]
  );

}

document
  .getElementById("generateButton")
  .addEventListener("click", testLoad);
  
</script>

</body>
</html>
